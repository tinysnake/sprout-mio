name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # push 与 pull_request 对同一分支是同一份代码，但 ref 字符串不同（refs/heads/<branch> 与
  # refs/pull/<n>/merge），只按 ref 归组会绕过取消，同一次推送跑两遍完整矩阵。按分支名归组。
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  portable:
    name: Linux / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      # 不需要页面链路的组，按预估耗时从重到轻排列；需要页面链路的组在 portableBrowser。
      matrix:
        group: [tooling, base, contracts, docs, tasks]
    env:
      SPROUT_PI_ENABLED: "false"
      SPROUT_VERIFY_CHAT_MODE: model-fixture
      MCP_EVERYTHING: "0"
      BETTER_AUTH_SECRET: sprout-ci-only-not-production-secret
      NO_PROXY: localhost,127.0.0.1,::1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux test tools
        if: matrix.group == 'base' || matrix.group == 'tooling'
        run: sudo apt-get update && sudo apt-get install -y lsof

      - name: Verify assigned gates
        env:
          VERIFY_GROUP: ${{ matrix.group }}
        run: pnpm verify:ci --group "$VERIFY_GROUP"

      - name: Verify database migration command
        if: matrix.group == 'base'
        env:
          DATABASE_URL: .verify/ci-migration.sqlite
        run: pnpm db:migrate

      - name: Upload reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.group }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .verify/runs/**/report.json
            .verify/runs/**/*.log
            .verify/targets/*.json
            .verify/sandboxes/**/*.log
            .verify/a-base/*.log
            .verify/b-tooling/*.log

  portableBrowser:
    name: Linux / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [api-a, turns, browser-b, api-b, browser-c, browser-a]
    env:
      SPROUT_PI_ENABLED: "false"
      SPROUT_VERIFY_CHAT_MODE: model-fixture
      MCP_EVERYTHING: "0"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.verify/browsers
      BETTER_AUTH_SECRET: sprout-ci-only-not-production-secret
      NO_PROXY: localhost,127.0.0.1,::1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify assigned gates
        env:
          VERIFY_GROUP: ${{ matrix.group }}
        run: pnpm verify:ci --group "$VERIFY_GROUP"

      - name: Upload reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.group }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .verify/runs/**/report.json
            .verify/runs/**/*.log
            .verify/targets/*.json
            .verify/sandboxes/**/*.log

  portableUnits:
    name: Linux / unit-${{ matrix.shard }}-of-4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SPROUT_PI_ENABLED: "false"
      SPROUT_VERIFY_CHAT_MODE: model-fixture
      MCP_EVERYTHING: "0"
      BETTER_AUTH_SECRET: sprout-ci-only-not-production-secret
      NO_PROXY: localhost,127.0.0.1,::1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux test tools
        run: sudo apt-get update && sudo apt-get install -y lsof

      - name: Verify portable unit shard
        env:
          UNIT_SHARD: ${{ matrix.shard }}
        run: pnpm test:ci --shard "$UNIT_SHARD/4"

      - name: Upload reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-unit-${{ matrix.shard }}-of-4-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
          path: .verify/units/*.json

  verify:
    if: always()
    needs: [portable, portableBrowser, portableUnits]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all Linux groups to pass
        if: always()
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
          BROWSER_RESULT: ${{ needs.portableBrowser.result }}
          UNIT_RESULT: ${{ needs.portableUnits.result }}
        run: |
          failed=0
          require_success() {
            if [ "$2" != success ]; then
              printf 'FAIL required job %s: %s\n' "$1" "${2:-missing}" >&2
              failed=1
            fi
          }
          require_success portable "$PORTABLE_RESULT"
          require_success portableBrowser "$BROWSER_RESULT"
          require_success portableUnits "$UNIT_RESULT"
          exit "$failed"

      - name: Reject cancelled workflow
        if: cancelled()
        run: |
          printf 'FAIL workflow cancelled\n' >&2
          exit 1
