name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Linux / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [base, tooling, docs, contracts, api, turns, browser]
    env:
      SPROUT_PI_ENABLED: "false"
      SPROUT_VERIFY_CHAT_MODE: model-fixture
      MCP_EVERYTHING: "0"
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sprout-playwright
      BETTER_AUTH_SECRET: sprout-ci-only-not-production-secret
      NO_PROXY: localhost,127.0.0.1,::1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux test tools
        run: sudo apt-get update && sudo apt-get install -y lsof

      - name: Install Chromium and system dependencies
        if: matrix.group == 'browser' || matrix.group == 'turns' || matrix.group == 'api'
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify assigned gates
        env:
          VERIFY_GROUP: ${{ matrix.group }}
        run: pnpm verify:ci --group "$VERIFY_GROUP"

      - name: Verify database migration command
        if: matrix.group == 'base'
        env:
          DATABASE_URL: .verify/ci-migration.sqlite
        run: pnpm db:migrate

      - name: Upload reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.group }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .verify/runs/**/report.json
            .verify/runs/**/*.log
            .verify/targets/*.json
            .verify/a-base/*.log
            .verify/b-tooling/*.log

  verify:
    if: always()
    needs: portable
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all Linux groups to pass
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
        run: test "$PORTABLE_RESULT" = success
