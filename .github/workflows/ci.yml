name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Linux / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      # 不需要页面链路的组，按预估耗时从重到轻排列；需要页面链路的组在 portableBrowser。
      matrix:
        group: [tooling, base, contracts, docs, tasks]
    env:
      SPROUT_PI_ENABLED: "false"
      SPROUT_VERIFY_CHAT_MODE: model-fixture
      MCP_EVERYTHING: "0"
      BETTER_AUTH_SECRET: sprout-ci-only-not-production-secret
      NO_PROXY: localhost,127.0.0.1,::1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux test tools
        if: matrix.group == 'base' || matrix.group == 'tooling'
        run: sudo apt-get update && sudo apt-get install -y lsof

      - name: Verify assigned gates
        env:
          VERIFY_GROUP: ${{ matrix.group }}
        run: pnpm verify:ci --group "$VERIFY_GROUP"

      - name: Verify database migration command
        if: matrix.group == 'base'
        env:
          DATABASE_URL: .verify/ci-migration.sqlite
        run: pnpm db:migrate

      - name: Upload reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.group }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .verify/runs/**/report.json
            .verify/runs/**/*.log
            .verify/targets/*.json
            .verify/sandboxes/**/*.log
            .verify/a-base/*.log
            .verify/b-tooling/*.log

  portableBrowser:
    name: Linux / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    # 浏览器与系统依赖由 Playwright 镜像预装：不需要下载浏览器，也不装 apt 包。
    # 镜像 tag 必须与 package.json 的 playwright 版本一致（targets.test.mjs 会核对）。
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      # 需要页面链路的组，按预估耗时从重到轻排列。
      matrix:
        group: [browser-c, browser-a, api-a, browser-b, api-b, turns]
    env:
      SPROUT_PI_ENABLED: "false"
      SPROUT_VERIFY_CHAT_MODE: model-fixture
      MCP_EVERYTHING: "0"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BETTER_AUTH_SECRET: sprout-ci-only-not-production-secret
      NO_PROXY: localhost,127.0.0.1,::1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # 容器里以 root 运行，挂载进来的 workspace 属于宿主 runner 用户，
      # 不声明 safe.directory 时 git 会以 dubious ownership 拒绝仓库操作。
      - name: Trust the mounted workspace
        run: git config --global --add safe.directory '*'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      # 临时诊断：prerender 回连 http://localhost:3000 失败，确认容器里的绑定与可达性。
      - name: Diagnose container networking
        if: matrix.group == 'api-a'
        run: |
          echo "== env =="
          env | grep -Ei '^(host|port|nitro|node_|playwright)' || true
          echo "== /etc/hosts =="
          cat /etc/hosts
          echo "== bindv6only =="
          cat /proc/sys/net/ipv6/bindv6only 2>/dev/null || echo "no ipv6"
          echo "== dns ==
          cat > /tmp/probe.mjs <<'PROBE'
          import net from "node:net";
          const detail = (error) => {
            const cause = error.cause;
            const errors = cause?.errors?.map((item) => `${item.code}@${item.address}:${item.port}`).join(",");
            return `${error.message} cause=${cause?.code ?? cause?.name ?? "?"} errors=${errors ?? "-"}`;
          };
          const round = async (label, options) => {
            const server = net.createServer((socket) => socket.end("ok"));
            await new Promise((done) => server.listen(options, done));
            console.log(label, "address", JSON.stringify(server.address()));
            try {
              const response = await fetch(`http://localhost:${options.port}/`);
              console.log(label, "fetch", response.status);
            } catch (error) {
              console.log(label, "fetch failed", detail(error));
            }
            await new Promise((done) => server.close(done));
          };
          await round("bind-localhost", { port: 3200, host: "localhost" });
          await round("bind-127.0.0.1", { port: 3201, host: "127.0.0.1" });
          await round("bind-default", { port: 3202 });
          try {
            const response = await fetch("http://127.0.0.1:3202/");
            console.log("default-then-127.0.0.1 fetch", response.status);
          } catch (error) {
            console.log("default-then-127.0.0.1 fetch failed", detail(error));
          }
          PROBE
          echo "== probe ==
          node /tmp/probe.mjs || true
          echo "== probe with ipv4first =="
          NODE_OPTIONS=--dns-result-order=ipv4first node /tmp/probe.mjs || true
          echo "== listeners while building (100ms) =="
          node -e '
          const fs = require("node:fs");
          const listeners = () => {
            const found = [];
            for (const file of ["/proc/net/tcp", "/proc/net/tcp6"]) {
              let text = "";
              try { text = fs.readFileSync(file, "utf8"); } catch { continue; }
              for (const line of text.split("\n").slice(1)) {
                const columns = line.trim().split(/\s+/);
                if (columns[3] === "0A") found.push(`${columns[1]}@${file.replace("/proc/net/", "")}`);
              }
            }
            return found;
          };
          const started = Date.now();
          const timer = setInterval(() => {
            const rows = listeners();
            if (rows.length) console.log(`${Date.now() - started}ms`, rows.join(" | "));
          }, 100);
          setTimeout(() => { clearInterval(timer); process.exit(0); }, 120000);
          ' > /tmp/diag-listen.log 2>&1 &
          poll=$!
          node scripts/verify/prepare.mjs server --fresh > /tmp/diag-build.log 2>&1 || true
          kill "$poll" 2>/dev/null || true
          echo "== listeners seen =="
          cat /tmp/diag-listen.log
          echo "== build tail =="
          tail -15 /tmp/diag-build.log

      - name: Verify assigned gates
        env:
          VERIFY_GROUP: ${{ matrix.group }}
        run: pnpm verify:ci --group "$VERIFY_GROUP"

      - name: Upload reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.group }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .verify/runs/**/report.json
            .verify/runs/**/*.log
            .verify/targets/*.json
            .verify/sandboxes/**/*.log

  verify:
    if: always()
    needs: [portable, portableBrowser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all Linux groups to pass
        # 被 cancel-in-progress 取消的旧运行不再额外制造一次失败。
        if: needs.portable.result != 'cancelled' && needs.portableBrowser.result != 'cancelled'
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
          PORTABLE_BROWSER_RESULT: ${{ needs.portableBrowser.result }}
        run: |
          test "$PORTABLE_RESULT" = success
          test "$PORTABLE_BROWSER_RESULT" = success
